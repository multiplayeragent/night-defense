  if (!k || i < 0) return;
  if (!canBuild(gridNow(), i)) { flash("Can't build there"); return; }
  if (coreNow().scrap < CONFIG.costs[k]) { flash(`Not enough scrap: a ${k} costs ${CONFIG.costs[k]}`); return; }
  if (host.acting) applyBuild(k, i, net.sessionId); else net.send("build", { k, x: i % N, y: Math.floor(i / N) });
  burst(tileX(i % N), 0.6, tileX(Math.floor(i / N)), "#d8c3a5", 8, 3); sfx("build");
}
function myTick(dt, g) {
  if (me.gameId !== g.id) { me.gameId = g.id; spawnMe(); }
  const key = g.id + ":" + g.night + ":" + g.phase;
  if (key !== me.phaseKey) {
    const first = !me.phaseKey; me.phaseKey = key;
    if (g.phase === "night") { banner(`Night ${g.night}`, "They come from the portals. Hold the core!"); if (!first) sfx("night"); }
    if (g.phase === "day") {
      Object.assign(me, { hp: CONFIG.hp, down: 0 });
      if (!first && g.night > CONFIG.startNight) { banner("Dawn", `You held night ${g.night - 1}. Build up before dark`); sfx("dawn"); if (board) board.submit(g.night - 1).catch(() => {}); }
      else banner(`Day ${g.night}`, "Shoot crystals for scrap, then build");
    }
  }
  if (me.down) { if (Date.now() >= me.rs) { spawnMe(); publish(true); } }
  else if (ATTRACT) stepBot(me, dt, g); // the preview plays you like a bot
  else {
    const len = Math.hypot(input.mx, input.mz), k = len > 1 ? 1 / len : 1;
    me.x += input.mx * k * CONFIG.speed * dt; me.z += input.mz * k * CONFIG.speed * dt;
    keepInArena(me);
    me.cd -= dt;
    if (input.fire && me.cd <= 0) {
      me.cd = 1 / CONFIG.fireRate; me.shots = (me.shots + 1) % 1000;
      fire(me.x, me.z, me.a + (Math.random() - 0.5) * CONFIG.spread * 2, net.sessionId);
      if (me.g) me.g.userData.firedAt = performance.now();
      sfx("shot");
    }
  }
  publish(false);
}
function publish(force) {
  const now = performance.now();
  if (!force && now - me.lastSend < 100) return; // ~10/s
  me.lastSend = now;
  net.me.set("p", JSON.stringify({ x: Math.round(me.x * 100) / 100, z: Math.round(me.z * 100) / 100, a: Math.round(me.a * 100) / 100, hp: Math.round(me.hp), down: me.down, rs: me.rs, shots: me.shots, b: me.pick && me.buildTile >= 0 ? me.buildTile : -1 }));
}

// Everyone else's survivors, eased toward where they last said they were. Their shots are tracers.
const views = new Map(); // id -> { g, x, z, a, shots, hp }
function syncSurvivors(dt) {
  const seen = new Set(), k = 1 - Math.pow(0.0008, dt);
  for (const s of team()) {
    if (s === me) continue;
    seen.add(s.id);
    let v = views.get(s.id);
    if (v && v.color !== s.color) { scene.remove(v.g); v = null; } // a new color: rebuild the model
    if (!v) { v = { g: makeSurvivor(s.color, ATTRACT ? "" : s.name), color: s.color, x: s.x, z: s.z, a: s.a, shots: s.shots, hp: s.hp }; views.set(s.id, v); }
    const snap = s.bot && host.acting;
    v.x += (s.x - v.x) * (snap ? 1 : k); v.z += (s.z - v.z) * (snap ? 1 : k); v.a += Math.atan2(Math.sin(s.a - v.a), Math.cos(s.a - v.a)) * (snap ? 1 : k);
    const fired = (s.shots - v.shots + 1000) % 1000; v.shots = s.shots;
    if (fired && !snap) { for (let i = 0; i < Math.min(3, fired); i++) fire(v.x, v.z, v.a + (Math.random() - 0.5) * 0.1, null); v.g.userData.firedAt = performance.now(); }
    if (s.hp < v.hp) burst(v.x, 1.3, v.z, "#d0293b", 5, 3);
    v.hp = s.hp;
    poseSurvivor(v.g, { ...s, x: v.x, z: v.z, a: v.a });
    // where this player is about to build
    let gh = otherGhosts.get(s.id);
    if (!s.bot && s.b >= 0) {
      if (!gh) { gh = mesh(new THREE.BoxGeometry(1.9, 0.12, 1.9), new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.45, depthWrite: false })); scene.add(gh); otherGhosts.set(s.id, gh); }
      gh.position.set(tileX(s.b % N), 0.08, tileX(Math.floor(s.b / N))); gh.visible = true;
    } else if (gh) gh.visible = false;
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); const gh = otherGhosts.get(id); if (gh) { scene.remove(gh); otherGhosts.delete(id); } }
  if (me.g && me.g.userData.color !== me.color) { scene.remove(me.g); me.g = null; }
  if (!me.g) { me.g = makeSurvivor(me.color, ""); me.g.userData.color = me.color; }
  poseSurvivor(me.g, me);
}
/** Two people in one color: the one with the higher sessionId picks a color nobody (and no bot) uses. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === me.color && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.color)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { me.color = free; net.me.set("c", free); }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
document.body.classList.toggle("attract", ATTRACT);
let board = null, lastCore = CONFIG.coreHp, coreHitAt = 0, netDown = false;
const startedAt = performance.now();
const goBtn = $("go");
goBtn.onclick = () => { if (host.acting) host.go = true; else net.send("go", {}); };
BLUEPRINTS.forEach((bp, n) => {
  const b = document.createElement("button"); b.dataset.k = bp.k;
  b.innerHTML = `${bp.name}<small>${CONFIG.costs[bp.k]}</small>`; b.title = `${n + 1}: ${bp.name}`;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); pick(bp.k); });
  $("build").append(b);
});
function pick(k) {
  me.pick = me.pick === k ? null : k;
  document.body.classList.toggle("placing", !!me.pick);
  for (const b of $("build").querySelectorAll("button")) b.classList.toggle("on", b.dataset.k === me.pick);
}
function banner(text, sub) { me.bannerUntil = performance.now() + 2600; me.bannerText = `${esc(text)}<small>${esc(sub)}</small>`; }
function flash(text) { me.bannerUntil = performance.now() + 1500; me.bannerText = `<small>${esc(text)}</small>`; }
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function hud(g) {
  const c = coreNow(), now = performance.now(), t = Date.now();
  if (c.hp < lastCore) coreHitAt = now;
  lastCore = c.hp;
  $("hurt").style.opacity = now - me.hurtAt < 250 ? 0.8 : me.down ? 0.45 : 0;
  if (ATTRACT) { $("net").textContent = ""; return; }
  const left = foeList().length + (host.acting ? host.queue : parseOnce("foes", S.shared.foes, decodeFoes).q);
  $("clock").innerHTML = g.phase === "day" ? `Day ${g.night}<small>Night falls in ${mmss(g.endsAt - t)}</small>` : g.phase === "night" ? `Night ${g.night}<small>${left} monster${left === 1 ? "" : "s"} left</small>` : `Night ${g.night}`;
  goBtn.hidden = g.phase !== "day";
  $("coreBar").style.width = Math.max(0, 100 * c.hp / CONFIG.coreHp) + "%";
  $("coreBar").style.background = now - coreHitAt < 300 ? "#ff6b6b" : "";
  $("scrap").textContent = c.scrap;
  for (const b of $("build").querySelectorAll("button")) b.classList.toggle("poor", c.scrap < CONFIG.costs[b.dataset.k]);
  $("meText").textContent = me.down ? `Knocked down: back up in ${Math.max(0, Math.ceil((me.rs - t) / 1000))}s` : `${Math.round(me.hp)} HP`;
  $("hpBar").style.width = Math.max(0, me.hp) + "%";
  $("team").innerHTML = team().map((s) => `<div class="${s === me ? "mine" : ""} ${s.down ? "down" : ""}"><span>${esc(s === me ? "You" : s.name)}</span><span class="bar"><i style="width:${Math.max(0, s.hp)}%"></i></span><span>${c.kills?.[s.id] || 0}</span></div>`).join("");
  $("msg").innerHTML = now < me.bannerUntil ? me.bannerText : g.phase === "night" && now - coreHitAt < 1500 ? "<small>The core is under attack!</small>" : "";
  $("hint").textContent = touchUI ? "Left thumb moves · right thumb aims and shoots · shoot gold crystals for scrap · tap Wall, Turret or Spikes, then PLACE" : "WASD to move · aim with the mouse · hold click to shoot · shoot gold crystals for scrap · 1–3 to pick a build, click to place";
  $("hint").style.opacity = now - startedAt < 12000 && g.phase !== "over" ? 1 : 0;
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the outpost" : ""}`;
  $("over").hidden = g.phase !== "over";
  if (g.phase === "over") {
    const nights = g.night - 1;
    $("overSub").textContent = nights ? `Your team survived ${nights} night${nights === 1 ? "" : "s"}.` : "It fell on the first night.";
    const rows = team().map((s) => ({ s, k: c.kills?.[s.id] || 0, m: c.mined?.[s.id] || 0 })).sort((x, y) => y.k - x.k);
    if (c.kills?.turrets) rows.push({ s: { name: "Turrets" }, k: c.kills.turrets, m: 0 });
    $("results").innerHTML = rows.map(({ s, k, m }) => `<li class="${s === me ? "mine" : ""}">${esc(s === me ? myName : s.name)}<span>${k} kills${m ? ` · ${m} scrap` : ""}</span></li>`).join("");
    $("next").textContent = `New game in ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s`;
    if (me.submittedFor !== g.id) { me.submittedFor = g.id; showBoard(nights); }
  }
}
function showBoard(nights) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  board.submit(nights).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} night${e.score === 1 ? "" : "s"}</span></li>`).join("") : "<li>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (host.acting) host.again = true; else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), mouse = { x: 0, y: 0, seen: false, down: false };
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE[k] || k === " ") e.preventDefault();
  keys.add(k);
  const n = Number(e.key); if (n >= 1 && n <= BLUEPRINTS.length && !e.repeat) pick(BLUEPRINTS[n - 1].k);
  if (k === "escape" && me.pick) pick(me.pick);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const cv = renderer.domElement;
cv.addEventListener("contextmenu", (e) => e.preventDefault());
// Twin thumb sticks: touch the left half to move, the right half to aim (and shoot).
const sticks = { move: null, aim: null };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") {
    if (e.button === 2 && me.pick) pick(me.pick);
    else if (e.button === 0) { if (me.pick) buildAt(me.buildTile); else mouse.down = true; }
    return;
  }
  const side = e.clientX < innerWidth / 2 ? "move" : "aim";
  if (sticks[side]) return;
  sticks[side] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, el: $(side === "move" ? "stickMove" : "stickAim") };
  Object.assign(sticks[side].el.style, { left: e.clientX + "px", top: e.clientY + "px" }); sticks[side].el.hidden = false;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  for (const s of Object.values(sticks)) if (s && s.id === e.pointerId) {
    let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const d = Math.hypot(dx, dy);
    if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
    s.dx = dx; s.dy = dy; s.el.firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
  }
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = false; return; }
  for (const side of ["move", "aim"]) if (sticks[side] && sticks[side].id === e.pointerId) { sticks[side].el.hidden = true; sticks[side] = null; }
});
$("place").addEventListener("pointerdown", (e) => { e.preventDefault(); buildAt(me.buildTile); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.28), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), at = new THREE.Vector3();
/** Turn keys, mouse and sticks into this frame's move, aim, trigger and build tile. The pointer goes through the camera that drew the frame. */
function readInput() {
  input.mx = input.mz = 0;
  for (const k of keys) if (MOVE[k]) { input.mx += MOVE[k][0]; input.mz += MOVE[k][1]; }
  if (sticks.move) { input.mx = sticks.move.dx / 50; input.mz = sticks.move.dy / 50; }
  const aimLen = sticks.aim ? Math.hypot(sticks.aim.dx, sticks.aim.dy) : 0;
  me.buildTile = -1;
  if (aimLen > 10) me.a = Math.atan2(sticks.aim.dx, sticks.aim.dy);
  else if (mouse.seen && !sticks.move) {
    ndc.set(mouse.x / innerWidth * 2 - 1, -(mouse.y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(aimPlane, at)) me.a = Math.atan2(at.x - me.x, at.z - me.z);
    if (me.pick && ray.ray.intersectPlane(groundPlane, at)) me.buildTile = tileAt(at.x, at.z);
  } else if (input.mx || input.mz) me.a = Math.atan2(input.mx, input.mz);
  if (me.pick && me.buildTile < 0 && !mouse.seen) me.buildTile = tileAt(me.x + Math.sin(me.a) * 2.6, me.z + Math.cos(me.a) * 2.6); // touch: the tile in front of me
  input.fire = aimLen > 22 || mouse.down || keys.has(" ");
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const focus = new THREE.Vector3(), camOff = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.acting = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the outpost meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const g = game();
  if (!ATTRACT) readInput();
  if (g) myTick(dt, g);
  syncOre(dt); syncGrid(now);
  syncFoes(dt); drawFoes(dt, t); turretsTick(dt, now);
  syncSurvivors(dt);
  stepBullets(dt); stepBolts(dt); stepBits(dt);
  const night = applySky(g, dt);
  // the core glows (redder as it gets hurt), the portals open at night
  const c = coreNow(), hurt = 1 - Math.max(0, c.hp) / CONFIG.coreHp;
  coreMat.emissive.setHSL(0.52 - 0.52 * hurt, 0.9, 0.55); coreMat.color.copy(coreMat.emissive);
  coreMat.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.25; crystal.rotation.y += dt * 0.6; crystal.position.y = 2.6 + Math.sin(t * 1.5) * 0.12;
  coreRings[0].rotation.z += dt * 1.2; coreRings[1].rotation.z -= dt * 0.8;
  coreLight.color.copy(coreMat.emissive); coreLight.intensity = 10 + 45 * night;
  const open = g && g.phase === "night" ? 1 : 0;
  portals.forEach((p, i) => { const s = p.scale.x + (Math.max(0.01, open) - p.scale.x) * Math.min(1, dt * 3); p.scale.setScalar(s); p.rotation.z = t * (i % 2 ? 1 : -1); });
  ghost.visible = !ATTRACT && !!me.pick && me.buildTile >= 0;
  if (ghost.visible) { const ok = canBuild(gridNow(), me.buildTile) && coreNow().scrap >= CONFIG.costs[me.pick]; ghost.position.set(tileX(me.buildTile % N), 0, tileX(Math.floor(me.buildTile / N))); ghostMat.color.set(ok ? "#52d273" : "#ff5d6c"); ghost.scale.y = me.pick === "spikes" ? 0.3 : me.pick === "turret" ? 1.1 : 1; }
  if (ATTRACT) { // the preview: a slow orbit around the outpost
    const a = t * 0.1 + 0.5;
    focus.set(0, 0, 0); camera.position.set(Math.sin(a) * 15.5, 11.5, Math.cos(a) * 15.5); camera.lookAt(0, 0.2, 0);
  } else { // a 3/4 camera that follows me (higher and wider on a phone held upright)
    const tall = innerHeight > innerWidth ? 1.55 : 1;
    camOff.set(0, 18, 11.5).multiplyScalar(tall);
    focus.lerp(P3.set(me.x, 0, me.z), 1 - Math.pow(0.002, dt));
    camera.position.copy(focus).add(camOff);
    if (now - me.hurtAt < 200) camera.position.x += (Math.random() - 0.5) * 0.4;
    camera.lookAt(focus);
  }
  sun.position.set(focus.x + 20, 36, focus.z + 14); sun.target.position.copy(focus);
  renderer.render(scene, camera);
  if (g && now - lastHud > 100) { lastHud = now; hud(g); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => { if (host.acting && m && typeof m.f === "number") applyHit(m.f, from); });
  net.on("mine", (m, from) => { if (host.acting && m && Number.isInteger(m.i)) applyMine(m.i, from); });
  net.on("build", (m, from) => { if (host.acting && m && Number.isInteger(m.x) && Number.isInteger(m.y) && m.x >= 0 && m.x < N && m.y >= 0 && m.y < N) applyBuild(m.k, m.y * N + m.x, from); });
  net.on("bite", (m) => { if (m && m.to === net.sessionId) applyBite(Math.min(100, Number(m.d) || 0)); });
  net.on("go", () => { if (host.acting) host.go = true; });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botList().map((b) => b.color)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 3, startNight: 9, firstDayMs: 1200, duskMs: 1000, spawnEvery: 0.15, foes: 80, foesGrow: 0, maxFoes: 50, portalRadius: 20, coreHp: 9999 });
  portals.forEach((g, i) => { g.position.set(PORTALS[i].x * CONFIG.portalRadius, 2.2, PORTALS[i].z * CONFIG.portalRadius); g.lookAt(0, 2.2, 0); });
  requestAnimationFrame(frame);
})();
</script>
